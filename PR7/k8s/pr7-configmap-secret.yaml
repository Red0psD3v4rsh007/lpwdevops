# ═══════════════════════════════════════════════════════════════════
# PR7: ConfigMaps and Secrets — Complete Manifest
# ═══════════════════════════════════════════════════════════════════

# ── 1. ConfigMap: non-sensitive application configuration ──────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: pr7-app-config
  labels:
    practical: pr7
data:
  APP_NAME: "pr7-config-demo"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  MAX_RETRIES: "3"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
---
# ── 2. Secret: sensitive configuration data ────────────────────────
# Values are base64-encoded (echo -n "value" | base64)
# DB_PASSWORD = "S3cur3P@ssw0rd"
# API_KEY     = "pr7-api-key-abc123xyz"
apiVersion: v1
kind: Secret
metadata:
  name: pr7-app-secret
  labels:
    practical: pr7
type: Opaque
data:
  DB_PASSWORD: UzNjdXIzUEBzc3cwcmQ=
  API_KEY: cHI3LWFwaS1rZXktYWJjMTIzeHl6
---
# ── 3. Deployment: app consumes both ConfigMap and Secret ──────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr7-config-app
  labels:
    app: pr7-config-app
    practical: pr7
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pr7-config-app
  template:
    metadata:
      labels:
        app: pr7-config-app
    spec:
      containers:
        - name: config-app
          image: 471565334027.dkr.ecr.us-east-1.amazonaws.com/pr7-config-app:latest
          ports:
            - containerPort: 5000
          # Load all keys from ConfigMap as environment variables
          envFrom:
            - configMapRef:
                name: pr7-app-config
            - secretRef:
                name: pr7-app-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
# ── 4. Service: LoadBalancer to expose the app ─────────────────────
apiVersion: v1
kind: Service
metadata:
  name: pr7-config-app
  labels:
    app: pr7-config-app
    practical: pr7
spec:
  selector:
    app: pr7-config-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer
